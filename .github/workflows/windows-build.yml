name: Windows Tinker Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/anne_tinker.py'
      - 'desktop/build_exe_windows.bat'
      - 'src/anne/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths "$env:GITHUB_WORKSPACE\src" --name ANNE_Tinker desktop\anne_tinker.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\ANNE_Tinker.exe')) { throw 'ANNE_Tinker.exe was not created.' }
          Get-Item 'dist\ANNE_Tinker.exe' | Format-List FullName,Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ANNE_Tinker_Windows
          path: dist/ANNE_Tinker.exe
          if-no-files-found: error
